name: LR2 CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Wait before pull request validation
        if: github.event_name == 'pull_request'
        run: sleep 60
      - name: Run LR2 tests
        run: python -m unittest discover -s LR2/tests -p "test_*.py"
